# Every entry with verify: true must be probed with scripts/validate_sources.py before it is
# trusted. Nothing here is confirmed working until the probe results are reported.
sources:
  - id: arxiv-cs-ai
    type: rss
    url: https://rss.arxiv.org/rss/cs.AI
    authority: 0.60
    default_tags: [research-papers]
    rate_limit_per_min: 4
    verify: true
    skip_weekends: true   # arXiv is empty on Saturday and Sunday (Appendix C 83)
  - id: arxiv-cs-cl
    type: rss
    url: https://rss.arxiv.org/rss/cs.CL
    authority: 0.60
    default_tags: [research-papers]
    rate_limit_per_min: 4
    verify: true
    skip_weekends: true   # arXiv is empty on Saturday and Sunday (Appendix C 83)
  - id: arxiv-cs-lg
    type: rss
    url: https://rss.arxiv.org/rss/cs.LG
    authority: 0.55
    default_tags: [research-papers]
    rate_limit_per_min: 4
    verify: true
    skip_weekends: true   # arXiv is empty on Saturday and Sunday (Appendix C 83)
  - id: hf-blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    authority: 0.80
    default_tags: [open-source-llms]
    rate_limit_per_min: 6
    verify: true
  - id: hf-daily-papers
    type: api
    url: https://huggingface.co/api/daily_papers
    authority: 0.75
    default_tags: [research-papers]
    rate_limit_per_min: 6
    verify: true
  - id: hn-ai
    type: api
    url: https://hn.algolia.com/api/v1/search_by_date?tags=story&query=LLM
    authority: 0.55
    default_tags: []
    rate_limit_per_min: 10
    verify: true
  - id: openai-news
    type: rss
    url: https://openai.com/news/rss.xml
    authority: 0.90
    default_tags: [llm-releases, ai-products-apps]
    rate_limit_per_min: 4
    verify: true
  - id: google-deepmind-blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    authority: 0.90
    default_tags: [llm-releases, research-papers]
    rate_limit_per_min: 4
    verify: true
  - id: github-releases
    type: github_releases
    repos: ["ollama/ollama", "ggml-org/llama.cpp", "vllm-project/vllm", "langchain-ai/langchain", "run-llama/llama_index", "huggingface/transformers"]
    url_template: https://github.com/{repo}/releases.atom
    authority: 0.70
    default_tags: [open-source-llms, mlops-infra]
    rate_limit_per_min: 10
    verify: true

