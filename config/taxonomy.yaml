  stability-ai:
    name: Stability AI
    aliases: ["StabilityAI", "Stable Diffusion"]
  langchain:
    name: LangChain
    aliases: ["LangGraph", "LangSmith", "langchain-ai"]
  llamaindex:
    name: LlamaIndex
    aliases: ["Llama Index", "llama_index", "run-llama"]
  ollama:
    name: Ollama
    aliases: ["ollama/ollama", "ollama.com"]
  vllm:
    name: vLLM
    aliases: ["vllm-project", "vllm-project/vllm"]
  llama-cpp:
    name: llama.cpp
    aliases: ["llama-cpp", "ggml-org/llama.cpp", "ggerganov/llama.cpp", "GGML"]
  pytorch:
    name: PyTorch
    aliases: ["pytorch/pytorch", "PyTorch Foundation"]
