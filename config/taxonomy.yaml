  transformers:
    name: Hugging Face Transformers
    aliases: ["huggingface/transformers", "transformers library"]
    ambiguous_aliases: ["transformers"]
    notes: "Bare 'transformers' is also the architecture and a film franchise."
  # --- proposed additions (review; delete any you do not want) ---
  amd:
    name: AMD
    aliases: ["AMD Instinct", "ROCm"]
    ambiguous_aliases: ["MI300"]
  apple:
    name: Apple
    aliases: ["Apple Intelligence", "Apple MLX"]
    ambiguous_aliases: ["MLX", "Siri"]
    notes: "Bare 'Apple' omitted on purpose (fruit)."
  perplexity:
