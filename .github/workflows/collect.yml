# Spec 5.5. Collects every ~3 hours and publishes to the `data` branch, which GitHub Pages serves.
# State between runs (store.json, archive/) lives on that branch. The git work is in
# scripts/publish_data.py (tested against a local repository): first-run branch creation, commit,
# weekly history squash. Nothing here runs a user's code; the token only pushes the data branch.
name: collect
on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours, UTC; GitHub starts scheduled runs on a best-effort basis
  workflow_dispatch:
permissions:
  contents: write   # pushes to the data branch only
  issues: write     # stale-source Issues (spec 11.1); the sync step is the only user
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Fetch the data branch (the first run starts it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m scripts.publish_data prepare --data-dir data --remote "$REMOTE"
      - name: Collect, process and write the feed
        env:
          CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m pipeline.run --out data/feed --window-hours 168 --contact "$CONTACT_URL"
      - name: Commit and push the data branch (squashes its history weekly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m scripts.publish_data push --data-dir data --remote "$REMOTE"
      - name: Open or close stale-source Issues
        continue-on-error: true   # a GitHub API problem must never fail the collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only this step gets it, never the scraper's process
        run: python -m scripts.sync_issues --meta data/feed/meta.json
